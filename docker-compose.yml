version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: weights-postgres
    environment:
      POSTGRES_DB: weights
      POSTGRES_USER: weights
      POSTGRES_PASSWORD: weights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weights-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weights"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weights-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=weights;Username=weights;Password=weights
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weights-network
    restart: unless-stopped

networks:
  weights-network:
    driver: bridge

volumes:
  postgres_data:
